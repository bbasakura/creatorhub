<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <title>MoonInAI Design System &amp; Color Tokens Banner</title>
  <defs>
    <radialGradient id="paper-texture" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </radialGradient>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C9C0B2" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="2" y="2" width="1196" height="376" rx="8" fill="url(#paper-texture)" stroke="#C9C0B2" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="376" rx="8" fill="url(#grid-pattern)"/>

  <!-- Editorial Top Bar -->
  <rect x="36" y="32" width="1128" height="1" fill="#1A1714"/>
  <text x="36" y="24" fill="#7D756A" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="700" letter-spacing="2">EDITORIAL VINTAGE × MODERN TECH</text>
  <text x="1164" y="24" fill="#F0652E" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">MOONINAI.TOP</text>

  <!-- Left Content Column -->
  <g transform="translate(48, 64)">
    <rect x="0" y="0" width="180" height="26" rx="4" fill="#F0652E"/>
    <text x="90" y="17" fill="#F4EFE6" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">DESIGN SYSTEM SPEC</text>

    <text x="0" y="70" fill="#1A1714" font-family="'Playfair Display', 'Noto Serif SC', Georgia, serif" font-size="38" font-weight="900" letter-spacing="-0.5">MoonInAI 配色拆解与设计系统</text>

    <text x="0" y="108" fill="#3A342D" font-family="system-ui, sans-serif" font-size="16" font-weight="500">复古社论报刊 (Editorial Vintage) 与现代高饱和爱马仕橘的美学重构</text>

    <text x="0" y="142" fill="#7D756A" font-family="system-ui, sans-serif" font-size="13">暖纸白底色 (#F4EFE6) · 深墨黑字 (#1A1714) · 焦点爱马仕橘 (#F0652E) · 纸质微晶格</text>

    <!-- Color Swatches Bar -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="80" height="40" rx="4" fill="#F4EFE6" stroke="#C9C0B2"/>
      <text x="40" y="24" fill="#1A1714" font-family="monospace" font-size="10" text-anchor="middle">#F4EFE6</text>

      <rect x="92" y="0" width="80" height="40" rx="4" fill="#1A1714"/>
      <text x="132" y="24" fill="#F4EFE6" font-family="monospace" font-size="10" text-anchor="middle">#1A1714</text>

      <rect x="184" y="0" width="80" height="40" rx="4" fill="#3A342D"/>
      <text x="224" y="24" fill="#F4EFE6" font-family="monospace" font-size="10" text-anchor="middle">#3A342D</text>

      <rect x="276" y="0" width="80" height="40" rx="4" fill="#7D756A"/>
      <text x="316" y="24" fill="#F4EFE6" font-family="monospace" font-size="10" text-anchor="middle">#7D756A</text>

      <rect x="368" y="0" width="80" height="40" rx="4" fill="#F0652E"/>
      <text x="408" y="24" fill="#F4EFE6" font-family="monospace" font-size="10" text-anchor="middle">#F0652E</text>

      <rect x="460" y="0" width="80" height="40" rx="4" fill="#C9C0B2"/>
      <text x="500" y="24" fill="#1A1714" font-family="monospace" font-size="10" text-anchor="middle">#C9C0B2</text>
    </g>
  </g>

  <!-- Right Visual Specimen Card -->
  <g transform="translate(680, 64)">
    <rect x="0" y="0" width="470" height="260" rx="6" fill="#F4EFE6" stroke="#1A1714" stroke-width="1.5"/>
    
    <!-- Header of Specimen -->
    <rect x="0" y="0" width="470" height="34" fill="#1A1714"/>
    <text x="16" y="22" fill="#F4EFE6" font-family="'Playfair Display', serif" font-size="13" font-weight="700">Issue No. 01 — Editorial Design Token</text>
    <text x="450" y="22" fill="#F0652E" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">SPEC 2026</text>

    <!-- Specimen Inner Content -->
    <g transform="translate(20, 52)">
      <text x="0" y="24" fill="#1A1714" font-family="'Playfair Display', 'Noto Serif SC', serif" font-size="22" font-weight="900">Humanist AI Aesthetic</text>
      <text x="0" y="48" fill="#3A342D" font-family="system-ui, sans-serif" font-size="13">拒绝冷冰阴暗黑夜风格，重塑具有阅读温度的文字与控件。</text>

      <line x1="0" y1="64" x2="430" y2="64" stroke="#C9C0B2" stroke-width="1"/>

      <text x="0" y="90" fill="#7D756A" font-family="system-ui, sans-serif" font-size="12">FEATURED ACCENT BUTTON</text>
      
      <!-- Primary Orange CTA Button Specimen -->
      <rect x="0" y="104" width="160" height="40" rx="4" fill="#F0652E"/>
      <text x="80" y="129" fill="#F4EFE6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">探索设计系统 →</text>

      <!-- Ghost Button Specimen -->
      <rect x="176" y="104" width="140" height="40" rx="4" fill="none" stroke="#1A1714" stroke-width="1.5"/>
      <text x="246" y="129" fill="#1A1714" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">查看样式源码</text>

      <rect x="330" y="104" width="90" height="40" rx="4" fill="#F0652E" fill-opacity="0.1" stroke="#F0652E" stroke-opacity="0.4"/>
      <text x="375" y="129" fill="#F0652E" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">15% Focus</text>
    </g>
  </g>

  <!-- Editorial Bottom Border Line -->
  <line x1="36" y1="350" x2="1164" y2="350" stroke="#1A1714" stroke-width="1.5"/>
</svg>