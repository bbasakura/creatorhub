<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <title>MoonInAI Color Swatches Palette Grid</title>
  <rect x="2" y="2" width="1196" height="236" rx="8" fill="#F4EFE6" stroke="#C9C0B2" stroke-width="1.5"/>

  <g transform="translate(30, 30)">
    <!-- Swatch 1: Paper -->
    <rect x="0" y="0" width="170" height="180" rx="6" fill="#F4EFE6" stroke="#C9C0B2" stroke-width="2"/>
    <rect x="0" y="110" width="170" height="70" rx="0" fill="#1A1714"/>
    <text x="16" y="136" fill="#F4EFE6" font-family="system-ui, sans-serif" font-size="14" font-weight="700">纸张背景 (--paper)</text>
    <text x="16" y="160" fill="#F0652E" font-family="monospace" font-size="13" font-weight="700">#F4EFE6</text>

    <!-- Swatch 2: Ink -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#1A1714"/>
      <rect x="0" y="110" width="170" height="70" rx="0" fill="#F4EFE6"/>
      <text x="16" y="136" fill="#1A1714" font-family="system-ui, sans-serif" font-size="14" font-weight="700">墨水主字 (--ink)</text>
      <text x="16" y="160" fill="#F0652E" font-family="monospace" font-size="13" font-weight="700">#1A1714</text>
    </g>

    <!-- Swatch 3: Ink Soft -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#3A342D"/>
      <rect x="0" y="110" width="170" height="70" rx="0" fill="#F4EFE6"/>
      <text x="16" y="136" fill="#1A1714" font-family="system-ui, sans-serif" font-size="14" font-weight="700">正文软墨 (--ink-soft)</text>
      <text x="16" y="160" fill="#3A342D" font-family="monospace" font-size="13" font-weight="700">#3A342D</text>
    </g>

    <!-- Swatch 4: Muted -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#7D756A"/>
      <rect x="0" y="110" width="170" height="70" rx="0" fill="#F4EFE6"/>
      <text x="16" y="136" fill="#1A1714" font-family="system-ui, sans-serif" font-size="14" font-weight="700">辅助灰字 (--muted)</text>
      <text x="16" y="160" fill="#7D756A" font-family="monospace" font-size="13" font-weight="700">#7D756A</text>
    </g>

    <!-- Swatch 5: Accent -->
    <g transform="translate(760, 0)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#F0652E"/>
      <rect x="0" y="110" width="170" height="70" rx="0" fill="#1A1714"/>
      <text x="16" y="136" fill="#F4EFE6" font-family="system-ui, sans-serif" font-size="14" font-weight="700">品牌强调 (--accent)</text>
      <text x="16" y="160" fill="#F0652E" font-family="monospace" font-size="13" font-weight="700">#F0652E</text>
    </g>

    <!-- Swatch 6: Line -->
    <g transform="translate(950, 0)">
      <rect x="0" y="0" width="170" height="180" rx="6" fill="#C9C0B2"/>
      <rect x="0" y="110" width="170" height="70" rx="0" fill="#1A1714"/>
      <text x="16" y="136" fill="#F4EFE6" font-family="system-ui, sans-serif" font-size="14" font-weight="700">结构线 (--line)</text>
      <text x="16" y="160" fill="#F0652E" font-family="monospace" font-size="13" font-weight="700">#C9C0B2</text>
    </g>
  </g>
</svg>