<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <title>bbasakura Profile Banner — MoonInAI Editorial Theme</title>
  <defs>
    <radialGradient id="moon-paper" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </radialGradient>
    <pattern id="moon-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C9C0B2" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Paper Container -->
  <rect x="2" y="2" width="1196" height="416" rx="8" fill="url(#moon-paper)" stroke="#1A1714" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="416" rx="8" fill="url(#moon-grid)"/>

  <!-- Top Header Line -->
  <line x1="36" y1="36" x2="1164" y2="36" stroke="#1A1714" stroke-width="1.5"/>
  <text x="36" y="26" fill="#7D756A" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="700" letter-spacing="2">EDITORIAL VINTAGE × MODERN TECH ACCENT</text>
  <text x="1164" y="26" fill="#F0652E" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">MOONINAI SYSTEM</text>

  <!-- Left Main Content -->
  <g transform="translate(48, 54)">
    <!-- Badge -->
    <rect x="0" y="0" width="186" height="26" rx="4" fill="#F0652E"/>
    <text x="93" y="17" fill="#F4EFE6" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">FULL-STACK &amp; AI AGENT</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#1A1714" font-family="'Playfair Display', 'Noto Serif SC', Georgia, serif" font-size="46" font-weight="900" letter-spacing="-1">bbasakura</text>
    <text x="0" y="110" fill="#F0652E" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Full-Stack Engineer · AI Agent &amp; Desktop Tools Specialist</text>

    <!-- Description -->
    <text x="0" y="146" fill="#3A342D" font-family="system-ui, sans-serif" font-size="15">Passionate about building high-performance desktop utilities, AI agent automations,</text>
    <text x="0" y="170" fill="#3A342D" font-family="system-ui, sans-serif" font-size="15">data algorithms, and modern developer tools with clean architecture.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="165" height="54" rx="4" fill="#F4EFE6" stroke="#1A1714" stroke-width="1.5"/>
      <text x="16" y="22" fill="#7D756A" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FOCUS</text>
      <text x="16" y="40" fill="#1A1714" font-family="system-ui, sans-serif" font-size="14" font-weight="800">AI &amp; Native Apps</text>

      <rect x="177" y="0" width="165" height="54" rx="4" fill="#F4EFE6" stroke="#1A1714" stroke-width="1.5"/>
      <text x="193" y="22" fill="#7D756A" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MAIN STACK</text>
      <text x="193" y="40" fill="#F0652E" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Python · Java · C#</text>

      <rect x="354" y="0" width="165" height="54" rx="4" fill="#F4EFE6" stroke="#1A1714" stroke-width="1.5"/>
      <text x="370" y="22" fill="#7D756A" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SYSTEM OS</text>
      <text x="370" y="40" fill="#1A1714" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Windows &amp; Linux</text>
    </g>
  </g>

  <!-- Right Window Specimen (Editorial Terminal Mockup) -->
  <g transform="translate(680, 54)">
    <rect x="0" y="0" width="470" height="326" rx="6" fill="#F4EFE6" stroke="#1A1714" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="470" height="36" fill="#1A1714"/>
    <circle cx="18" cy="18" r="5" fill="#F0652E"/>
    <circle cx="34" cy="18" r="5" fill="#C9C0B2"/>
    <circle cx="50" cy="18" r="5" fill="#7D756A"/>
    <text x="235" y="23" fill="#F4EFE6" font-family="monospace" font-size="12" text-anchor="middle">bbasakura@editorial-env ~</text>

    <!-- Terminal Text -->
    <g transform="translate(20, 52)">
      <text x="0" y="20" fill="#F0652E" font-family="monospace" font-size="13" font-weight="700">$ codex status --user bbasakura</text>
      <text x="0" y="44" fill="#1A1714" font-family="monospace" font-size="12" font-weight="700">✔ Core Engine: Active (MoonInAI Spec)</text>
      <text x="0" y="64" fill="#3A342D" font-family="monospace" font-size="12">├─ Projects: Tuzi Balance Widget, Codex Bot</text>
      <text x="0" y="84" fill="#3A342D" font-family="monospace" font-size="12">├─ Security: DPAPI Encrypted Storage</text>
      <text x="0" y="104" fill="#3A342D" font-family="monospace" font-size="12">├─ Palette: Paper #F4EFE6 · Ink #1A1714</text>
      <text x="0" y="124" fill="#3A342D" font-family="monospace" font-size="12">└─ Accent: Hermes Orange #F0652E</text>
      
      <line x1="0" y1="140" x2="430" y2="140" stroke="#C9C0B2" stroke-width="1"/>

      <text x="0" y="164" fill="#F0652E" font-family="monospace" font-size="13" font-weight="700">$ python -m tuzi_widget.launch</text>
      <text x="0" y="188" fill="#1A1714" font-family="monospace" font-size="12">[INFO] Floating Widget Initialized [Quota: OK]</text>
      <text x="0" y="208" fill="#7D756A" font-family="monospace" font-size="12">[SYS] Listening for key updates &amp; balance telemetry...</text>

      <rect x="0" y="228" width="10" height="18" fill="#F0652E"/>
      <text x="16" y="242" fill="#7D756A" font-family="monospace" font-size="12">Ready for next deployment</text>
    </g>
  </g>

  <!-- Editorial Bottom Line -->
  <line x1="36" y1="396" x2="1164" y2="396" stroke="#1A1714" stroke-width="1.5"/>
</svg>